# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Low-memory friendly: run the Kotlin compiler inside the Gradle daemon
# instead of a second JVM, and cap its heap (helps in 2GB cgroup sandboxes;
# harmless in CI, just slightly slower).
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx896m
# Cache Gradle's configuration phase so subsequent invocations skip the model
# build. Cuts noop incremental builds from ~5s → ~1s. Safe with AGP 8.7+.
org.gradle.configuration-cache=true
# Run independent task DAG branches in parallel where possible.
org.gradle.parallel=true
# Cache task outputs across builds (also re-uses outputs from `clean` rebuilds
# of the same content). Pairs well with configuration cache.
org.gradle.caching=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Pinned to the 10.2 series (latest 10.2.4): QEMU 11 removed 32-bit host
# support (tcg/arm), so armeabi-v7a can only build on 10.x. 10.2 is the last
# line that still ships a 32-bit ARM host backend.
podroidQemuVersion=10.2.4
podroidKernelVersion=7.0.10
