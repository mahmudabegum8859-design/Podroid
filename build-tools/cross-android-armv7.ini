# Meson cross file for 32-bit ARM (armeabi-v7a, API 26) — used by the
# Dockerfile qemu-builder stage when ABI=armeabi-v7a. Mirrors
# cross-android-aarch64.ini. 4KB page devices: no max-page-size flag.
# Bionic keeps 64-bit atomics in a separate lib on 32-bit ARM, so link args
# carry -latomic (pulled in by the NDK's arm-linux-androideabi/26 sysroot).
[binaries]
c = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang'
cpp = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang++'
ar = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
ranlib = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
nm = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm'
pkg-config = '/usr/local/bin/armv7-android-pkg-config'
[properties]
sys_root = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
pkg_config_libdir = ['/opt/deps/lib/pkgconfig']
c_args = ['--sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-target', 'armv7a-linux-androideabi26', '-I/opt/deps/include', '-fPIC', '-O2', '-march=armv7-a']
cpp_args = ['--sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-target', 'armv7a-linux-androideabi26', '-I/opt/deps/include', '-fPIC', '-O2', '-march=armv7-a']
c_link_args = ['--sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-target', 'armv7a-linux-androideabi26', '-L/opt/deps/lib', '-latomic']
cpp_link_args = ['--sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-target', 'armv7a-linux-androideabi26', '-L/opt/deps/lib', '-latomic']
[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
