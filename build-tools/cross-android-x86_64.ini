# Meson cross file for x86_64 Android (API 26) — used by the Dockerfile
# qemu-builder stage when ABI=x86_64. Mirrors cross-android-aarch64.ini.
# x86_64 Android devices use 4KB pages (16KB pages are an ARM64 thing), so no
# max-page-size flag; Bionic ships 64-bit atomics in libc, so no -latomic.
[binaries]
c = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang'
cpp = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang++'
ar = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
ranlib = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
nm = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm'
pkg-config = '/usr/local/bin/x86_64-android-pkg-config'
[properties]
sys_root = '/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
pkg_config_libdir = ['/opt/deps/lib/pkgconfig']
c_args = ['--sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-target', 'x86_64-linux-android26', '-I/opt/deps/include', '-fPIC', '-O2']
cpp_args = ['--sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-target', 'x86_64-linux-android26', '-I/opt/deps/include', '-fPIC', '-O2']
c_link_args = ['--sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-target', 'x86_64-linux-android26', '-L/opt/deps/lib']
cpp_link_args = ['--sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot', '-target', 'x86_64-linux-android26', '-L/opt/deps/lib']
[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
